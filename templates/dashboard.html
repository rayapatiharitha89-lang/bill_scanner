<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spending Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; }
        .navbar { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; font-size: 15px; }
        .navbar a:hover { text-decoration: underline; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h2 { margin: 0; font-size: 36px; color: #27ae60; }
        .stat-card p { margin: 5px 0 0; color: #777; font-size: 14px; }
        .chart-card { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .chart-card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #2c3e50; color: white; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        tr:hover { background: #f9f9f9; }
    </style>
</head>
<body>

<div class="navbar">
    <span>📊 Spending Dashboard</span>
    <div>
        <a href="/">🧾 Scan Bill</a>
        <a href="/history">📋 History</a>
    </div>
</div>

<div class="container">

    <!-- Summary Cards -->
    <div class="stats">
        <div class="stat-card">
            <h2 id="totalSpent">$0</h2>
            <p>💰 Total Spent</p>
        </div>
        <div class="stat-card">
            <h2 id="totalReceipts">0</h2>
            <p>🧾 Receipts Scanned</p>
        </div>
        <div class="stat-card">
            <h2 id="avgSpent">$0</h2>
            <p>📊 Average Per Receipt</p>
        </div>
    </div>

    <!-- Line Chart — Spending Over Time -->
    <div class="chart-card">
        <h3>📈 Spending Over Time</h3>
        <canvas id="lineChart" height="100"></canvas>
    </div>

    <!-- Bar + Top Items -->
    <div class="charts-row">
        <div class="chart-card">
            <h3>🏪 Spending by Store</h3>
            <canvas id="barChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>🏆 Top 10 Items</h3>
            <table>
                <thead><tr><th>Item</th><th>Total Spent</th></tr></thead>
                <tbody id="topItems"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
async function loadDashboard() {
    const res = await fetch('/api/dashboard');
    const data = await res.json();

    // Summary stats
    const totalSpent = data.line_data.reduce((s, r) => s + r.total, 0);
    const count = data.line_data.length;
    document.getElementById('totalSpent').textContent = '$' + totalSpent.toFixed(2);
    document.getElementById('totalReceipts').textContent = count;
    document.getElementById('avgSpent').textContent = count ? '$' + (totalSpent/count).toFixed(2) : '$0';

    // Line Chart
    new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: {
            labels: data.line_data.map(r => r.date),
            datasets: [{
                label: 'Amount Spent ($)',
                data: data.line_data.map(r => r.total),
                borderColor: '#27ae60',
                backgroundColor: 'rgba(39,174,96,0.1)',
                borderWidth: 3,
                pointBackgroundColor: '#27ae60',
                pointRadius: 6,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: true } },
            scales: {
                y: { beginAtZero: true, ticks: { callback: v => '$' + v } }
            }
        }
    });

    // Bar Chart
    const stores = Object.keys(data.store_totals);
    const storeTotals = Object.values(data.store_totals);
    const colors = ['#3498db','#e74c3c','#f39c12','#9b59b6','#1abc9c','#e67e22'];

    new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
            labels: stores,
            datasets: [{
                label: 'Total Spent ($)',
                data: storeTotals,
                backgroundColor: colors.slice(0, stores.length),
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { callback: v => '$' + v } }
            }
        }
    });

    // Top Items Table
    const tbody = document.getElementById('topItems');
    tbody.innerHTML = '';
    data.top_items.forEach((item, i) => {
        tbody.innerHTML += `<tr>
            <td>${i+1}. ${item.name}</td>
            <td>$${item.total.toFixed(2)}</td>
        </tr>`;
    });
}

loadDashboard();
</script>
</body>
</html>
